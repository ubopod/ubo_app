# METABEGIN
# X-Env-Layer-Name: ubo-base
# X-Env-Layer-Category: suite
# X-Env-Layer-Desc: Base layer for UBO App images. Sets up the Raspberry Pi
#  environment, installs ubo-app via install.sh, and configures system services.
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: bookworm-minbase
#
# X-Env-VarPrefix: ubo
# X-Env-Var-app_version:
# X-Env-Var-app_version-Desc: Version of ubo-app to install.
# X-Env-Var-app_version-Required: y
# X-Env-Var-app_version-Valid: string
# X-Env-Var-app_version-Set: y
# X-Env-Var-image_name:
# X-Env-Var-image_name-Desc: Name written to /etc/ubo_base_image.
# X-Env-Var-image_name-Required: y
# X-Env-Var-image_name-Valid: string
# X-Env-Var-image_name-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - accountsservice
    - dhcpcd
    - dnsmasq
    - gcc
    - git
    - hostapd
    - i2c-tools
    - ir-keytable
    - libasound2-dev
    - libcap-dev
    - libegl1
    - libgl1
    - libmtdev1
    - libzbar0
    - pipewire
    - portaudio19-dev
    - python3-alsaaudio
    - python3-apt
    - python3-dev
    - python3-gpiozero
    - python3-libcamera
    - python3-picamera2
    - python3-pip
    - python3-pyaudio
    - python3-virtualenv
    - wireplumber

  customize-hooks:
    - echo "Raspberry Pi reference $(date +%Y-%m-%d)" > "$1/etc/rpi-issue"
    - echo "$IGconf_ubo_image_name" > "$1/etc/ubo_base_image"
    - chroot "$1" systemctl disable dnsmasq || true
    - chroot "$1" systemctl disable dhcpcd || true
    - chroot "$1" systemctl disable userconfig || true
    - cp "$IGconf_ubo_staging_dir/install.sh" "$1/tmp/install.sh"
    - chmod +x "$1/tmp/install.sh"
    - cp -r "$IGconf_ubo_staging_dir/wheels" "$1/tmp/wheels"
    - chroot "$1" /tmp/install.sh --in-packer --wheels-directory=/tmp/wheels --target-version="$IGconf_ubo_app_version"
    - rm -rf "$1/tmp/install.sh" "$1/tmp/wheels"
    - chroot "$1" apt-get clean -y
