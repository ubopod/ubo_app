name: ESP32 Firmware

on:
  push:
    branches:
      - main
      - development
    tags:
      - "v*"
  pull_request:
    paths:
      - "ubo_lvgl/**"
      - ".github/workflows/esp32_firmware.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-C6 Firmware
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract Version
        id: version
        run: |
          VERSION=$(git describe --tags --always)
          echo "VERSION=$VERSION" >>"$GITHUB_OUTPUT"

      - name: Build Firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32c6
          path: ubo_lvgl/esp32
          command: idf.py build && idf.py merge-bin -o ubo-lvgl-esp32c6-merged.bin

      - name: Stage Artifacts
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          BUILD=ubo_lvgl/esp32/build
          mkdir -p dist
          cp "$BUILD/ubo-lvgl-esp32c6-merged.bin" \
            "dist/ubo-lvgl-esp32c6-$VERSION-merged.bin"
          cp "$BUILD/bootloader/bootloader.bin" dist/
          cp "$BUILD/partition_table/partition-table.bin" dist/
          cp "$BUILD/ubo_lvgl_esp32c6.bin" dist/
          cp "$BUILD/flasher_args.json" dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-firmware-${{ steps.version.outputs.VERSION }}
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Attach Firmware to Release
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Procure Firmware
        uses: actions/download-artifact@v4
        with:
          name: esp32c6-firmware-${{ needs.build.outputs.version }}
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ubo-lvgl-esp32c6-*-merged.bin
          fail_on_unmatched_files: true
