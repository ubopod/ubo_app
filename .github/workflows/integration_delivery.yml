name: CI/CD

on:
  push:
    branches:
      - main
      - development
    tags:
      - "v*"
  pull_request:

env:
  PYTHON_VERSION: "3.11.9"

jobs:
  version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.VERSION }}
      name: ${{ steps.extract-version.outputs.NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: ubuntu-latest

      - name: Extract Version
        id: extract-version
        run: |
          git fetch --prune --unshallow
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*
          echo "VERSION=$(uvx --with hatch-vcs hatch version)" >>"$GITHUB_OUTPUT"
          echo "VERSION=$(uvx --with hatch-vcs hatch version)"
          echo "NAME=$(uvx --with hatch-vcs hatch project metadata | jq -r .name)" >>"$GITHUB_OUTPUT"
          echo "NAME=$(uvx --with hatch-vcs hatch project metadata | jq -r .name)"

  type-check:
    name: Type Check
    runs-on: ubo-pod-pi5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: ubo-pod

      - name: Create virtualenv
        run: |
          uv venv --system-site-packages

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Create stub files
        run: |
          uv run --frozen pyright --createstub kivy

      - name: Build protobuf files and gRPC bindings
        run: |
          uv run --frozen poe proto:generate:raw
          uv run --frozen poe proto:compile:raw

      - name: Sync LVGL GUI client virtualenv
        run: |
          uv sync --frozen --directory ubo_app/lvgl_gui

      - name: Type Check
        run: |
          uv run --frozen poe typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: ubuntu-latest

      - name: Extract Ruff version from pyproject.toml
        run: |
          SPEC=$(grep -Po '"ruff\K[^"]+' pyproject.toml | head -1)
          RUFF_VER=$(echo "$SPEC" | sed -E 's/.*(>=|==)//')
          echo "RUFF_VER=$RUFF_VER" >>$GITHUB_ENV

      - name: Run Ruff
        run: uvx ruff@${{ env.RUFF_VER }} check .

  test:
    name: Test
    strategy:
      matrix:
        runner: ["ubo-pod-pi4", "ubo-pod-pi5", "ubuntu-latest"]
    runs-on: ${{ matrix.runner }}
    environment:
      name: test
      url: https://app.codecov.io/gh/${{ github.repository }}/
    steps:
      - name: System Dependencies
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libgl1 libmtdev1 libzbar0 libportaudio2 portaudio19-dev

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # Self-hosted Pi pods reuse their work dir, so actions/checkout only
      # re-materializes LFS files whose commit changed and leaves the rest as
      # stale pointer files (e.g. sounds/*.wav). The boot chime reads
      # sounds/ready.wav, so force every LFS object to real content here.
      - name: Materialize Git LFS
        if: startsWith(matrix.runner, 'ubo-pod')
        run: git lfs pull

      - name: Setup Python
        if: matrix.runner == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: ${{ startsWith(matrix.runner, 'ubo-pod') && 'ubo-pod' ||
            'ubuntu-latest' }}

      - name: Create virtualenv
        run: |
          uv venv --system-site-packages

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Install GUI client
        run: |
          cd ubo_app/gui
          UV_PROJECT_ENVIRONMENT=.venv uv venv --system-site-packages .venv
          UV_PROJECT_ENVIRONMENT=.venv uv sync --frozen

      - name: Build protobuf files and gRPC bindings
        run: |
          uv run --frozen poe proto:generate:raw
          uv run --frozen poe proto:compile:raw

      # Provider secrets live in a file on the Pi runners (UBO_SECRETS_PATH),
      # not in GitHub Secrets, so GitHub doesn't auto-mask them. Register every
      # value with ::add-mask:: — parsed with the same dotenv reader the tests
      # use — so any accidental print/traceback is redacted for the whole job.
      - name: Mask provider secrets in logs
        if: startsWith(matrix.runner, 'ubo-pod')
        run: |
          uv run --frozen python <<'PY'
          import os
          from dotenv import dotenv_values

          path = os.environ.get('UBO_SECRETS_PATH')
          values = dotenv_values(path).values() if path and os.path.exists(path) else []
          for value in values:
              for line in (value or '').splitlines():
                  if line.strip():
                      print(f'::add-mask::{line}')
          PY

      - name: Run Tests
        run: |
          mkdir -p $HOME/.kivy/mods
          uv run --frozen poe test --showlocals --make-screenshots --cov=ubo_app --cov-report=xml --cov-report=html --log-level=DEBUG

      # Real-credential provider round-trips run only on the Pi pods, which hold
      # the secrets file (UBO_SECRETS_PATH); providers without keys self-skip.
      # Invoke the service's own `test:providers` task directly — no
      # `--showlocals`/`--log-level=DEBUG`, which would dump keys on failure.
      - name: Run Provider E2E Tests
        if: startsWith(matrix.runner, 'ubo-pod')
        run: |
          cd ubo_app/services/090-assistant/ubo-service
          uv run poe test:providers

      - name: Collect Window Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.runner }}
          path: tests/**/results/**/*.png

      - name: Collect Store Snapshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots-${{ matrix.runner }}
          path: tests/**/results/**/*.jsonc

      - name: Collect HTML Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.runner }}
          path: htmlcov

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: ${{ matrix.runner }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  proto:
    name: Protobuf Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y portaudio19-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: ubuntu-latest

      - name: Install buf cli
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Build protobuf files
        run: |
          uv run --frozen poe proto:generate

      - name: Upload Protobuf Files
        uses: actions/upload-artifact@v4
        with:
          name: proto-files
          path: ubo_app/rpc/proto
          if-no-files-found: error

  bindings:
    name: Python Bindings
    runs-on: ubuntu-latest
    needs:
      - version
      - proto
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y portaudio19-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: ubuntu-latest

      - name: Download Protobuf Files
        uses: actions/download-artifact@v4
        with:
          name: proto-files
          path: ubo_app/rpc/proto

      - name: Generate Python Bindings
        run: |
          uv run --frozen poe proto:compile

      - name: Build
        env:
          PRETEND_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd ubo_app/rpc
          uv build

      - name: Upload Bindings Package
        uses: actions/upload-artifact@v4
        with:
          name: bindings-package
          path: dist/*
          if-no-files-found: error

  services:
    name: Services
    runs-on: ubuntu-latest
    needs:
      - version
      - bindings
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y portaudio19-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: ubuntu-latest

      - name: Build protobuf files and gRPC bindings
        run: |
          uv run --frozen poe proto:generate:raw
          uv run --frozen poe proto:compile:raw

      - name: Test Services
        env:
          PRETEND_VERSION: ${{ needs.version.outputs.version }}
        run: |
          for service in $(ls ubo_app/services); do
            dir="ubo_app/services/$service/ubo-service"
            # Only services that define a bare `test` poe task. These are the
            # fast unit tests (`-m "not providers"`): no credentials, models, or
            # network — the provider/round-trip suites stay opt-in. The regex
            # tolerates indentation and `test=`/`test =` spacing; it won't match
            # `"test:providers"` (quoted) or `pytest`.
            if [ -d "$dir" ] && grep -qE '^[[:space:]]*test[[:space:]]*=' "$dir/pyproject.toml"; then
              echo "Testing service: $service"
              (cd "$dir" && uv run poe test)
            fi
          done

      - name: Build Services
        env:
          PRETEND_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p services-packages
          for service in $(ls ubo_app/services); do
            if [ -d "ubo_app/services/$service/ubo-service" ]; then
              echo "Building service: $service"
              cd ubo_app/services/$service/ubo-service
              uv build
              cp dist/* $GITHUB_WORKSPACE/services-packages/
              cd -
            fi
          done
          echo "Building GUI client"
          cd ubo_app/gui
          uv build
          cp dist/* $GITHUB_WORKSPACE/services-packages/
          cd -
          echo "Building LVGL GUI client"
          cd ubo_app/lvgl_gui
          uv build
          cp dist/* $GITHUB_WORKSPACE/services-packages/
          cd -
          if [ ! "$(ls -A services-packages)" ]; then
            touch services-packages/non-empty
          fi

      - name: Upload Services Packages
        uses: actions/upload-artifact@v4
        with:
          name: services-packages
          path: services-packages/**

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - version
      - proto
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y portaudio19-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: ubuntu-latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download Protobuf Files
        uses: actions/download-artifact@v4
        with:
          name: proto-files
          path: ubo_app/rpc/proto

      - name: Build Web Application
        run: |
          cd ubo_app/services/090-web-ui/web-app
          npm install
          npm run proto:compile
          npm run build

      - name: Configure Sentry
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "SENTRY_DSN=$SENTRY_DSN" >>ubo_app/.env
          # check whether it's a tag or not
          if [ "$GITHUB_EVENT_NAME" == "push" ] && [ "$(echo $GITHUB_REF | grep -c 'refs/tags/v')" -eq 1 ]; then
            echo "SENTRY_RELEASE=ubo-app@$VERSION" >>ubo_app/.env
          else
            echo "SENTRY_RELEASE=ubo-app@$GITHUB_SHA" >>ubo_app/.env
            echo "UBO_DEBUG_PDB_SIGNAL=True" >>ubo_app/.env
          fi
          cat ubo_app/.env

      - name: Build
        env:
          PRETEND_VERSION: ${{ needs.version.outputs.version }}
        run: uv build

      - name: Upload Ubo App Package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*
          if-no-files-found: error

  images:
    name: Create Images
    needs:
      - version
      - type-check
      - lint
      - test
      - build
    runs-on: ubuntu-24.04-arm
    container:
      image: mkaczanowski/packer-builder-arm
      volumes:
        - /dev:/dev
      options: --rm --privileged
    strategy:
      fail-fast: false
      matrix:
        suffix: ["lite", ""]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Ubo App Package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: /build/dist

      - name: Download Bindings Package
        uses: actions/download-artifact@v4
        with:
          name: bindings-package
          path: /build/dist

      - name: Download Services Packages
        uses: actions/download-artifact@v4
        with:
          name: services-packages
          path: /build/dist

      - name: Generate Image URL and Checksum
        id: generate-image-url
        env:
          MATRIX_SUFFIX: ${{ matrix.suffix }}
        run: |
          SUFFIX=""
          if [ -n "$MATRIX_SUFFIX" ]; then
            SUFFIX="_$MATRIX_SUFFIX"
          fi
          DASHED_SUFFIX=$(echo $SUFFIX | sed 's/_/-/g')
          IMAGE_DATE='2025-05-13'
          IMAGE_NAME="${IMAGE_DATE}-raspios-bookworm-arm64${DASHED_SUFFIX}"
          IMAGE_URL="https://downloads.raspberrypi.com/raspios${SUFFIX}_arm64/images/raspios${SUFFIX}_arm64-${IMAGE_DATE}/${IMAGE_NAME}.img.xz"
          CHECKSUM_URL="${IMAGE_URL}.sha256"
          echo "suffix=$SUFFIX" >>"$GITHUB_OUTPUT"
          echo "dashed_suffix=$DASHED_SUFFIX" >>"$GITHUB_OUTPUT"
          echo "image_url=$IMAGE_URL" >>"$GITHUB_OUTPUT"
          echo "image_name=$IMAGE_NAME" >>"$GITHUB_OUTPUT"
          echo "image_checksum_url=$CHECKSUM_URL" >>"$GITHUB_OUTPUT"
          if [ "$MATRIX_SUFFIX" = "lite" ]; then
            IMAGE_SIZE_GB=8
          elif [ "$MATRIX_SUFFIX" = "" ]; then
            IMAGE_SIZE_GB=10
          else
            IMAGE_SIZE_GB=13
          fi
          IMAGE_SIZE=$(awk -v IMAGE_SIZE_GB=$IMAGE_SIZE_GB 'BEGIN {printf "%.0f", IMAGE_SIZE_GB * 1024 ^ 3}')
          echo "image_size=$IMAGE_SIZE" >>"$GITHUB_OUTPUT"

      - name: Download Bundled Docker Images
        run: |
          # Daemon-less pull of the images listed in the manifest into tarballs
          # that Packer bakes into the image and a first-boot service loads.
          MANIFEST=scripts/packer/bundled-docker-images.txt
          DEST=/build/docker-images
          mkdir -p "$DEST"

          apt-get update
          apt-get install -y curl

          CRANE_VERSION=v0.20.2
          curl -fsSL \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_arm64.tar.gz" \
            | tar -xz -C /usr/local/bin crane
          crane version

          while IFS= read -r ref || [ -n "$ref" ]; do
            ref="${ref%%#*}"
            ref="$(echo "$ref" | xargs)"
            [ -z "$ref" ] && continue
            sanitized="$(echo "$ref" | tr '/:' '__')"
            echo "Pulling $ref -> $DEST/$sanitized.tar"
            crane pull --platform linux/arm64 "$ref" "$DEST/$sanitized.tar"
          done <"$MANIFEST"

          ls -lh "$DEST"

      - name: Build Artifact
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKR_VAR_ubo_app_version: ${{ needs.version.outputs.version }}
          PKR_VAR_image_url: ${{ steps.generate-image-url.outputs.image_url }}
          PKR_VAR_image_name: ${{ steps.generate-image-url.outputs.image_name }}
          PKR_VAR_image_checksum_url: ${{ steps.generate-image-url.outputs.image_checksum_url }}
          PKR_VAR_target_image_size: ${{ steps.generate-image-url.outputs.image_size}}
        run: |
          /entrypoint.sh init scripts/packer/image.pkr.hcl
          SETUP_QEMU=false /entrypoint.sh build scripts/packer/image.pkr.hcl
          mv image.img /build

      - name: Fill Free Space with Zeros
        run: |
          apt-get update
          apt-get install -y zerofree
          LOOP_DEV=$(losetup -f)
          losetup -P $LOOP_DEV /build/image.img
          zerofree -v "${LOOP_DEV}p2"
          losetup -d $LOOP_DEV

      - name: Compress File with Gzip
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DASHED_SUFFIX: ${{ steps.generate-image-url.outputs.dashed_suffix }}
        run: |
          scripts/consume.sh /build/image.img | gzip -9 >/ubo_app-$VERSION-bookworm$DASHED_SUFFIX.img.gz

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: ubo_app-${{ needs.version.outputs.version }}-bookworm${{
            steps.generate-image-url.outputs.dashed_suffix}}-arm64.img.gz
          path: /ubo_app-${{ needs.version.outputs.version }}-bookworm${{
            steps.generate-image-url.outputs.dashed_suffix }}.img.gz
          if-no-files-found: error

  esp32:
    name: Build ESP32-C6 Firmware
    needs:
      - version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32c6
          path: ubo_lvgl/esp32
          command: idf.py build && idf.py merge-bin -o ubo-lvgl-esp32c6-merged.bin

      - name: Stage Artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          BUILD=ubo_lvgl/esp32/build
          mkdir -p esp32-firmware
          cp "$BUILD/ubo-lvgl-esp32c6-merged.bin" \
            "esp32-firmware/ubo-lvgl-esp32c6-$VERSION-merged.bin"
          cp "$BUILD/bootloader/bootloader.bin" esp32-firmware/
          cp "$BUILD/partition_table/partition-table.bin" esp32-firmware/
          cp "$BUILD/ubo_lvgl_esp32c6.bin" esp32-firmware/
          cp "$BUILD/flasher_args.json" esp32-firmware/

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-firmware-${{ needs.version.outputs.version }}
          path: esp32-firmware/
          if-no-files-found: error

  publish:
    name: Publish
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/development')
    needs:
      - version
      - type-check
      - lint
      - test
      - bindings
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.version.outputs.name }}/${{
        needs.version.outputs.version }}
    permissions:
      id-token: write
    steps:
      - name: Download Ubo App Package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - name: Download Bindings Package
        uses: actions/download-artifact@v4
        with:
          name: bindings-package
          path: dist

      - name: Download Services Packages
        uses: actions/download-artifact@v4
        with:
          name: services-packages
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Release
    needs:
      - version
      - type-check
      - lint
      - test
      - build
      - publish
      - images
      - esp32
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/v${{
        needs.version.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Procure Lite Image
        uses: actions/download-artifact@v4
        with:
          name: ubo_app-${{ needs.version.outputs.version
            }}-bookworm-lite-arm64.img.gz
          path: artifacts

      - name: Procure Default Image
        uses: actions/download-artifact@v4
        with:
          name: ubo_app-${{ needs.version.outputs.version }}-bookworm-arm64.img.gz
          path: artifacts

      - name: Procure Ubo App Package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: artifacts

      - name: Procure Bindings Package
        uses: actions/download-artifact@v4
        with:
          name: bindings-package
          path: artifacts

      - name: Procure Services Packages
        uses: actions/download-artifact@v4
        with:
          name: services-packages
          path: artifacts

      - name: Procure ESP32 Firmware
        uses: actions/download-artifact@v4
        with:
          name: esp32c6-firmware-${{ needs.version.outputs.version }}
          path: esp32-firmware

      - name: Split Large Files into 2GB chunks in a for loop only if they are
          bigger than 2GB
        run: |
          for file in artifacts/*; do
            if [ $(stat -c%s "$file") -gt 2147000000 ]; then
              split -b 2147000000 "$file" "$file"_
              rm "$file"
            fi
          done

      - name: Extract Release Notes
        id: changelog
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          NOTES_FILE="docs/releases/${VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error file=${NOTES_FILE}::Release notes are required for GitHub releases."
            exit 1
          fi
          cp "$NOTES_FILE" CURRENT_CHANGELOG.md
          {
            echo "CONTENT<<EOF"
            cat CURRENT_CHANGELOG.md
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
            esp32-firmware/ubo-lvgl-esp32c6-*-merged.bin
          tag_name: v${{ needs.version.outputs.version }}
          body: |
            PyPI package: https://pypi.org/project/${{ needs.version.outputs.name }}/${{ needs.version.outputs.version }}

            # Changes:
            ${{ steps.changelog.outputs.CONTENT }}

            ---

            *Note than GitHub doesn't allow assets bigger than 2GB in a release. Due to this, the files bigger than 2GB have been split into 2GB chunks. You can join them using the following command:*

            ```bash
            cat [[filename]]_* > [[filename]]
            ```
          prerelease: false
          draft: false
