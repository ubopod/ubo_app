[project]
name = "zha-cli"
version = "0.1.0"
description = "CLI tool for managing Zigbee coordinators using ZHA"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [
    {name = "Martin"}
]
keywords = ["zigbee", "zha", "cli", "home-automation", "iot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "zha>=0.0.80",
    "rich>=13.0.0",
    "pyserial>=3.5",
]

[project.scripts]
zha-cli = "zha_cli.main:main"

[project.urls]
Repository = "https://github.com/your-username/zha-cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zha_cli"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["zha_cli"]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]
