[project]
name = "ubo-app-mcp-gateway"
dynamic = ["version"]
description = "MCP aggregating gateway for ubo-app; communicates with it over its gRPC API"
license = "Apache-2.0"
authors = [
  { name = "Mehrdad M", email = "mehrdad@getubo.com" },
  { name = "Sassan Haradji", email = "me@sassanh.com" },
]
maintainers = [
  { name = "Mehrdad M", email = "mehrdad@getubo.com" },
  { name = "Sassan Haradji", email = "me@sassanh.com" },
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
keywords = ['ubo', 'ubo-pod', 'ubo-service', 'mcp', 'gateway']
dependencies = [
  # Upper bound is load-bearing: FastMCP 4.x changed the client handshake
  # (it opens with `server/discover`), which older backends reject. In proxy
  # mode that leaves the session uninitialized, so `list_tools` fails and the
  # gateway aggregates *zero* tools instead of erroring. Do not relax without
  # verifying `create_proxy` against a 3.x stdio backend.
  "fastmcp==3.4.2",
  "uvicorn==0.49.0",
  "starlette==1.2.1",
  "loguru==0.7.3",
  "ubo-app-raw-bindings==2.1.0",
]

[tool.uv]
dev-dependencies = [
  "poethepoet>=0.36.0",
  "pyright>=1.1.408",
  "ruff>=0.12.1",
  "pytest>=8.0.0",
]

[tool.uv.sources]
ubo-app-raw-bindings = { path = "../../../rpc", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "code"
path = "parent_version.py"
expression = "get_version()"

[tool.hatch.build]
packages = ["ubo_mcp_gateway"]

[project.scripts]
ubo-mcp-gateway = "ubo_mcp_gateway.main:main"

[tool.poe.tasks]
lint = "ruff check ."
"lint:fix" = "ruff check . --fix --unsafe-fixes"
typecheck = "pyright -p pyproject.toml ."
test = "pytest"
sanity = ["typecheck", "lint"]

[tool.poe.tasks.deploy-to-device]
args = [
  { name = "skip_deps", type = "boolean" },
  { name = "offline", type = "boolean" },
  { name = "index", type = "integer", default = '1' },
]
cmd = "scripts/deploy.sh"

[tool.pytest.ini_options]
# Own config so pytest doesn't walk up and inherit the core repo's options
# (which reference plugins this subproject's venv doesn't install).
testpaths = ["tests"]

[tool.ruff]
target-version = 'py311'

[tool.ruff.lint]
select = ["ALL"]
ignore = ["INP001", "PLR0911", "D203", "D213", "PLC0415", "TD003"]
fixable = ["ALL"]
unfixable = []
logger-objects = ['loguru.logger']

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR0913", "PLR0915", "PLR2004", "SLF001"]
"test_*.py" = ["S101", "PLR0913", "PLR0915", "PLR2004", "SLF001"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.format]
quote-style = "single"

[tool.isort]
profile = "black"
